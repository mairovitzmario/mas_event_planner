guest_task:
  description: >
    Extract and summarize {guest_name}'s RSVP status, dietary restrictions, and seating preferences from the master guest list below:
    {guest_list}
  expected_output: >
    A short summary of {guest_name}'s RSVP status, dietary restrictions, and seating preferences (or simply state they are not attending).

menu_formulation_task:
  description: >
    Using all the guest information provided by the guest tasks, aggregate the dietary restrictions of those ATTENDING and formulate a final menu that accommodates everyone.
  expected_output: >
    A final menu plan with specific dishes catering to the aggregated dietary restrictions.
  agent: catering_agent

seating_and_final_plan_task:
  description: >
    Using the guests' preferences and the proposed menu, finalize the event plan. Produce a seating chart that honors preferences and avoids conflicts (only for attending guests).
  expected_output: >
    A comprehensive event plan with: 1) The final menu, 2) The seating chart for attending guests, 3) A summary of attendance.
    Formatted as markdown without '```'.
  agent: host_agent
